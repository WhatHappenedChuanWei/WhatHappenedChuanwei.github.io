<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工坊写作</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8501e">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--bg:#fbfaf7;--panel:#f2f0ea;--act:#e9e6dd;--fg:#2b2a28;--mute:#8a867d;--line:#e2dfd6;--acc:#c8501e;--code:#efece4;--sel:#ffe9d6;--mark:#ffd9a8}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--panel:#252320;--act:#181715;--fg:#e8e4da;--mute:#8d887c;--line:#34312c;--acc:#f08a4b;--code:#2a2825;--sel:#4a3322;--mark:#6b4a22}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
[hidden]{display:none!important}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
button{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button:hover{background:var(--sel)}
button.on{background:var(--sel);color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
#app{display:flex;height:100%}
#act{width:46px;background:var(--act);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex:none}
#act button{width:36px;height:36px;justify-content:center;border-radius:8px;color:var(--mute);padding:0}
#act button .ic{width:20px;height:20px}
#act button.on{color:var(--acc);background:var(--panel)}
#act .sp{flex:1}
#act img{width:26px;height:26px;margin-bottom:8px}
#side{width:var(--side-w,270px);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;min-height:0}
body.noside #side{display:none}
.ph{display:flex;align-items:center;gap:2px;padding:8px 8px 6px 12px;font-weight:600;font-size:12px;color:var(--mute);letter-spacing:.04em}
.ph .sp{flex:1}
.ph button{padding:3px 5px}
#files,#searchpane{display:flex;flex-direction:column;min-height:0;flex:1}
#tree,#res{overflow:auto;flex:1;padding-bottom:20px}
.it{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-size:13.5px;user-select:none}
.it:hover{background:var(--sel)}
.it.cur{background:var(--sel);color:var(--acc);font-weight:600}
.it.dir{font-weight:600}
.it .nm{overflow:hidden;text-overflow:ellipsis}
.it .ic{color:var(--mute)}
.it.cur .ic{color:var(--acc)}
.it.dim{opacity:.45}
.empty{padding:12px;color:var(--mute);font-size:13px}
#ctx{display:none;position:fixed;z-index:20;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:4px 0;min-width:160px}
#ctx div{padding:6px 14px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center}
#ctx div:hover{background:var(--sel)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#qbox{display:flex;gap:4px;padding:0 10px 8px}
#q{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;outline:0}
#q:focus{border-color:var(--acc)}
#qinfo{padding:0 12px 6px;font-size:12px;color:var(--mute)}
.rf{padding:6px 12px 2px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.rf:hover{background:var(--sel)}
.rl{padding:2px 12px 2px 30px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl:hover{background:var(--sel);color:var(--fg)}
.rl b{color:var(--mute);font-weight:400;margin-right:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
#work{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:4px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#top .sp{flex:1}
#top label{font-size:13px;display:inline-flex;gap:4px;align-items:center;margin:0 6px;cursor:pointer}
#fmt{display:flex;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#fmt button{min-width:30px;justify-content:center;padding:4px 6px;font-size:13px;font-weight:600}
#fmt .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#ed,#pv{min-width:0;overflow:auto}
#ed{flex:0 0 var(--ed-w,50%)}
#pv{flex:1}
body.m-edit #ed,body.m-read #pv{flex:1}
.gutter{width:6px;margin:0 -3px;flex:none;cursor:col-resize;position:relative;z-index:5;background:transparent;touch-action:none}
.gutter::after{content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.gutter:hover::after,.gutter.drag::after{background:var(--acc)}
body.noside #g-side,body.m-edit #g-pv,body.m-read #g-pv{display:none}
body.dragging{cursor:col-resize;user-select:none}
body.dragging textarea,body.dragging iframe{pointer-events:none}
#ed{border:0;outline:0;resize:none;padding:22px 28px;background:var(--bg);color:var(--fg);font:15px/1.75 Consolas,"Microsoft YaHei",monospace;tab-size:2}
#pv{padding:22px 34px;border-left:1px solid var(--line);background:var(--bg)}
body.m-edit #pv{display:none}
body.m-read #ed{display:none}
body.m-read #pv{border-left:0}
body.m-read #pv .doc{margin:0 auto}
.doc{max-width:760px}
.doc h1,.doc h2,.doc h3{line-height:1.3;margin:1.4em 0 .5em}
.doc h1{font-size:1.9em;margin-top:.2em}.doc h2{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.2em}.doc h3{font-size:1.2em}
.doc p{margin:.7em 0}
.doc img{max-width:100%;border-radius:6px}
.doc code{background:var(--code);padding:1px 5px;border-radius:4px;font:.9em Consolas,monospace}
.doc pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto}
.doc pre code{background:none;padding:0}
.doc blockquote{margin:.8em 0;padding:.1em 1em;border-left:4px solid var(--acc);color:var(--mute);background:var(--panel)}
.doc table{border-collapse:collapse;margin:.8em 0}
.doc th,.doc td{border:1px solid var(--line);padding:5px 12px}
.doc th{background:var(--panel)}
.doc a{color:var(--acc)}
.doc hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
.doc li.task{list-style:none;margin-left:-1.2em}
.doc .more{margin:1em 0;text-align:center;color:var(--mute);font-size:12px;border-top:1px dashed var(--mute);padding-top:4px}
.doc .head{color:var(--mute);font-size:13px;margin-bottom:6px}
.doc .head span{margin-right:12px}
.welcome{text-align:center;color:var(--mute);margin:12vh auto 0}
.welcome img{width:96px;height:96px}
.welcome h2{color:var(--fg);margin:.4em 0 .2em}
.welcome p{margin:.3em 0}
.welcome button{margin:14px 4px 0;border-color:var(--line);padding:6px 14px}
#bar{display:flex;gap:16px;padding:3px 12px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--mute)}
#bar .sp{flex:1}
#bar .dirty{color:var(--acc);font-weight:600}
#msg{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;font-size:13px;z-index:30}
#msg.show{opacity:.92}
#drop{display:none;position:fixed;inset:0;background:rgba(200,80,30,.12);border:3px dashed var(--acc);z-index:9;pointer-events:none}
#help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40}
#help .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px 26px;min-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#help h3{margin:0 0 10px}
#help table{border-collapse:collapse;width:100%}
#help td{padding:3px 0}
#help td:first-child{color:var(--acc);font-family:Consolas,monospace;padding-right:24px;white-space:nowrap}
</style>
</head>
<body class="m-split">

<div id="app">
  <nav id="act">
    <img src="icon.svg" alt="">
    <button data-p="files" class="on" title="文件"><svg class="ic"><use href="#i-files"/></svg></button>
    <button data-p="search" title="搜索 (Ctrl+Shift+F)"><svg class="ic"><use href="#i-search"/></svg></button>
    <span class="sp"></span>
    <button id="b-help" title="快捷键与帮助"><svg class="ic"><use href="#i-help"/></svg></button>
  </nav>
  <aside id="side">
    <div id="files">
      <div class="ph"><span id="rootname">文件</span><span class="sp"></span>
        <button id="t-file" title="新建文件"><svg class="ic"><use href="#i-file-plus"/></svg></button>
        <button id="t-dir" title="新建文件夹"><svg class="ic"><use href="#i-folder-plus"/></svg></button>
        <button id="t-ref" title="刷新"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button id="t-col" title="全部折叠"><svg class="ic"><use href="#i-collapse"/></svg></button>
      </div>
      <div id="tree"></div>
    </div>
    <div id="searchpane" hidden>
      <div class="ph"><span>搜索</span></div>
      <div id="qbox"><input id="q" placeholder="搜文件名和全文…" spellcheck="false"><button id="q-case" title="区分大小写"><svg class="ic"><use href="#i-case"/></svg></button></div>
      <div id="qinfo"></div>
      <div id="res"></div>
    </div>
  </aside>
  <div class="gutter" id="g-side" title="拖动调整宽度，双击恢复"></div>
  <section id="work">
    <div id="top">
      <button id="b-open" title="选择 blog 或 blog\source 文件夹"><svg class="ic"><use href="#i-folder-open"/></svg><span id="b-open-t">打开文件夹</span></button>
      <button id="b-new" title="在 _posts 里新建文章"><svg class="ic"><use href="#i-file-plus"/></svg>新文章</button>
      <button id="b-save" title="保存 (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg>保存</button>
      <label><input type="checkbox" id="c-auto"> 自动保存</label>
      <span class="sp"></span>
      <button data-m="m-edit" title="仅写作"><svg class="ic"><use href="#i-edit"/></svg></button>
      <button data-m="m-split" title="分栏"><svg class="ic"><use href="#i-columns"/></svg></button>
      <button data-m="m-read" title="仅阅读"><svg class="ic"><use href="#i-eye"/></svg></button>
    </div>
    <div id="fmt"></div>
    <div id="main">
      <textarea id="ed" spellcheck="false"></textarea>
      <div class="gutter" id="g-pv" title="拖动调整宽度，双击恢复"></div>
      <div id="pv"><div class="doc" id="doc"></div></div>
    </div>
    <div id="bar"><span id="s-file">未打开文件</span><span id="s-dirty"></span><span class="sp"></span><span id="s-count"></span></div>
  </section>
</div>
<div id="msg"></div>
<div id="drop"></div>
<div id="help"><div class="card">
  <h3>快捷键</h3>
  <table>
    <tr><td>Ctrl+S</td><td>保存</td></tr>
    <tr><td>Ctrl+B / I / K</td><td>粗体 / 斜体 / 链接</td></tr>
    <tr><td>Ctrl+Shift+F</td><td>全文搜索</td></tr>
    <tr><td>Ctrl+V</td><td>粘贴截图（自动存到 img）</td></tr>
    <tr><td>Tab</td><td>缩进两格</td></tr>
    <tr><td>回车</td><td>列表自动续写，空项退出</td></tr>
    <tr><td>右键文件树</td><td>新建 / 重命名 / 删除</td></tr>
    <tr><td>F11</td><td>全屏</td></tr>
    <tr><td>资源管理器右键</td><td>用工坊写作打开（需先运行「安装工坊写作」）</td></tr>
  </table>
  <p style="margin:12px 0 0;color:var(--mute);font-size:12px">点击空白处关闭 · 删除不进回收站，请谨慎</p>
</div></div>
<script src="md.js"></script>
<script src="editor.js"></script>
</body>
</html>
